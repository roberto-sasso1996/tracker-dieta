<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palestra — Tracker</title>
<link rel="stylesheet" href="css/style.css">
<style>:root { --accent: var(--gym); }</style>
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="theme-color" content="#c1531f">
</head>
<body>

<div class="shell">
  <div class="topbar">
    <div class="brand"><span class="mark">◆</span><span class="name">Tracker</span></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="gym.html" class="active">Palestra</a>
      <a href="food.html">Pasti</a>
    </nav>
  </div>

  <main>
    <div class="hero">
      <div class="eyebrow" style="color:var(--gym);">ALLENAMENTO</div>
      <h1>Storico carichi</h1>
    </div>

    <div class="section-title" style="margin-top:0;">
      <span>Storico</span>
      <button class="link-btn" id="exportCsvBtn" style="color:var(--gym);">⬇ Esporta CSV</button>
    </div>
    <div id="workoutList"><div class="empty-state">Caricamento…</div></div>
  </main>
</div>

<button class="fab" id="addBtn" style="--accent: var(--gym);">+</button>

<!-- ---------- SHEET: nuovo allenamento ---------- -->
<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet">
    <div class="sheet-head">
      <h2>Nuovo allenamento</h2>
      <button class="icon-btn" id="closeSheet">✕</button>
    </div>

    <div class="field">
      <label for="wDate">Data</label>
      <input type="date" id="wDate">
    </div>

    <div class="section-title" style="margin-top:6px;">Pesi</div>
    <div id="exerciseContainer"></div>
    <button class="link-btn" id="addExerciseBtn" style="color:var(--gym);">+ Aggiungi esercizio</button>

    <div class="section-title" style="margin-top:18px;">Cardio</div>
    <div id="cardioContainer"></div>
    <button class="link-btn" id="addCardioBtn" style="color:var(--gym);">+ Aggiungi cardio</button>
    <p style="font-size:0.78rem; color:var(--text-faint); margin-top:6px;">
      La stima AI delle kcal usa peso/età/altezza dal tuo profilo (Home → Impostazioni), se li hai inseriti.
    </p>

    <div class="field" style="margin-top:16px;">
      <label for="wNotes">Note (opzionale)</label>
      <textarea id="wNotes" placeholder="Sensazioni, recupero, variazioni…"></textarea>
    </div>

    <div class="error-msg" id="wError" style="display:none;"></div>
    <button class="btn" id="saveWorkoutBtn" style="--accent: var(--gym); margin-top:8px;">Salva allenamento</button>
  </div>
</div>

<!-- ---------- SHEET DETTAGLIO ALLENAMENTO ---------- -->
<div class="sheet-backdrop" id="detailBackdrop">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="detailTitle">Dettaglio</h2>
      <button class="icon-btn" id="closeDetail">✕</button>
    </div>
    <div id="detailBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { requireAuth } from "./js/auth.js";
import { db } from "./js/firebase-init.js";
import { collection, addDoc, deleteDoc, doc, query, orderBy, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { estimateKcalForActivity, hasApiKey } from "./js/ai-vision.js";
import { getProfile } from "./js/profile.js";
import { downloadCsv } from "./js/csv-utils.js";

let currentUser = null;
let currentProfile = null;
let exerciseIdCounter = 0;
let cardioIdCounter = 0;
let allWorkouts = [];

requireAuth().then(async (user) => {
  currentUser = user;
  try {
    currentProfile = await getProfile(user.uid);
  } catch (e) {
    console.error(e);
  }
  loadWorkouts();
});

function todayStr() { return new Date().toISOString().slice(0, 10); }

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---------------- lista storico ----------------

async function loadWorkouts() {
  const listEl = document.getElementById("workoutList");
  const wq = query(collection(db, "users", currentUser.uid, "workouts"), orderBy("date", "desc"));
  const snap = await getDocs(wq);

  allWorkouts = snap.docs.map((d) => ({ id: d.id, ...d.data() }));

  if (allWorkouts.length === 0) {
    listEl.innerHTML = '<div class="empty-state">Nessun allenamento registrato. Tocca + per iniziare.</div>';
    return;
  }

  listEl.innerHTML = "";
  allWorkouts.forEach((w) => {
    const id = w.id;
    const dateLabel = new Date(w.date + "T00:00:00").toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "short" });

    let exercisesHtml = "";
    (w.exercises || []).forEach((ex) => {
      let setsHtml = "";
      (ex.sets || []).forEach((s, i) => {
        setsHtml += `<div class="set-row"><span class="set-idx">${i + 1}</span><span class="set-val">${s.reps} rip. × ${s.weight} kg</span></div>`;
      });
      exercisesHtml += `
        <div style="margin-top:10px;">
          <div class="entry-title" style="font-size:0.9rem;">${escapeHtml(ex.name)}</div>
          ${setsHtml}
        </div>`;
    });

    let cardioHtml = "";
    (w.cardio || []).forEach((c) => {
      const parts = [];
      if (c.distanceKm) parts.push(`${c.distanceKm} km`);
      if (c.durationMin) parts.push(`${c.durationMin} min`);
      if (c.speedKmh) parts.push(`${c.speedKmh} km/h media`);
      if (c.kcal) parts.push(`${c.kcal} kcal`);
      cardioHtml += `
        <div style="margin-top:10px;">
          <div class="entry-title" style="font-size:0.9rem;">🏃 ${escapeHtml(c.activity || "Cardio")}</div>
          <div class="set-row"><span class="set-val">${parts.join(" · ")}</span></div>
        </div>`;
    });

    const metaParts = [];
    if ((w.exercises || []).length) metaParts.push(`${w.exercises.length} esercizi`);
    if ((w.cardio || []).length) metaParts.push(`${w.cardio.length} cardio`);

    listEl.innerHTML += `
      <div class="day-group">
        <div class="day-label">${dateLabel.toUpperCase()}</div>
        <div class="entry" data-workout-id="${id}" style="cursor:pointer;">
          <div class="entry-head">
            <span class="entry-meta">${metaParts.join(" · ") || "—"}</span>
            <button class="icon-btn" data-del="${id}" title="Elimina">🗑</button>
          </div>
          ${exercisesHtml}
          ${cardioHtml}
          ${w.notes ? `<p style="margin-top:10px; font-size:0.85rem; color:var(--text-dim);">${escapeHtml(w.notes)}</p>` : ""}
        </div>
      </div>`;
  });

  listEl.querySelectorAll("[data-del]").forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!confirm("Eliminare questo allenamento?")) return;
      await deleteDoc(doc(db, "users", currentUser.uid, "workouts", btn.dataset.del));
      loadWorkouts();
    });
  });

  listEl.querySelectorAll("[data-workout-id]").forEach((el) => {
    el.addEventListener("click", () => {
      const w = allWorkouts.find((x) => x.id === el.dataset.workoutId);
      if (w) openWorkoutDetail(w);
    });
  });
}

// ---------------- sheet dettaglio allenamento ----------------

const detailBackdrop = document.getElementById("detailBackdrop");
document.getElementById("closeDetail").addEventListener("click", () => detailBackdrop.classList.remove("open"));
detailBackdrop.addEventListener("click", (e) => { if (e.target === detailBackdrop) detailBackdrop.classList.remove("open"); });

function openWorkoutDetail(w) {
  const dateLabel = new Date(w.date + "T00:00:00").toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" });
  document.getElementById("detailTitle").textContent = dateLabel;

  let html = "";
  (w.exercises || []).forEach((ex) => {
    let setsHtml = "";
    (ex.sets || []).forEach((s, i) => {
      setsHtml += `<div class="set-row"><span class="set-idx">${i + 1}</span><span class="set-val">${s.reps} rip. × ${s.weight} kg</span></div>`;
    });
    html += `<div style="margin-top:10px;"><div class="entry-title" style="font-size:0.9rem;">${escapeHtml(ex.name)}</div>${setsHtml}</div>`;
  });
  (w.cardio || []).forEach((c) => {
    const parts = [];
    if (c.distanceKm) parts.push(`${c.distanceKm} km`);
    if (c.durationMin) parts.push(`${c.durationMin} min`);
    if (c.speedKmh) parts.push(`${c.speedKmh} km/h media`);
    if (c.kcal) parts.push(`${c.kcal} kcal`);
    html += `<div style="margin-top:10px;"><div class="entry-title" style="font-size:0.9rem;">🏃 ${escapeHtml(c.activity || "Cardio")}</div><div class="set-row"><span class="set-val">${parts.join(" · ")}</span></div></div>`;
  });
  if (w.notes) html += `<p style="margin-top:16px; font-size:0.85rem; color:var(--text-dim);">${escapeHtml(w.notes)}</p>`;

  document.getElementById("detailBody").innerHTML = html || '<div class="empty-state">Nessun dettaglio.</div>';
  detailBackdrop.classList.add("open");
}

// ---------------- export CSV ----------------

document.getElementById("exportCsvBtn").addEventListener("click", () => {
  if (allWorkouts.length === 0) {
    showToast("Nessun dato da esportare.");
    return;
  }
  const rows = [["Data", "Tipo", "Esercizio/Attività", "Serie", "Ripetizioni", "Peso kg", "Distanza km", "Durata min", "Velocità media km/h", "Kcal", "Note"]];
  allWorkouts.slice().reverse().forEach((w) => {
    (w.exercises || []).forEach((ex) => {
      (ex.sets || []).forEach((s, i) => {
        rows.push([w.date, "Pesi", ex.name, i + 1, s.reps, s.weight, "", "", "", "", w.notes || ""]);
      });
    });
    (w.cardio || []).forEach((c) => {
      rows.push([w.date, "Cardio", c.activity || "", "", "", "", c.distanceKm || "", c.durationMin || "", c.speedKmh || "", c.kcal || "", w.notes || ""]);
    });
  });
  downloadCsv(`allenamenti_${todayStr()}.csv`, rows);
});

// ---------------- form nuovo allenamento ----------------

const sheetBackdrop = document.getElementById("sheetBackdrop");
document.getElementById("addBtn").addEventListener("click", () => {
  document.getElementById("wDate").value = todayStr();
  document.getElementById("exerciseContainer").innerHTML = "";
  document.getElementById("cardioContainer").innerHTML = "";
  document.getElementById("wNotes").value = "";
  document.getElementById("wError").style.display = "none";
  exerciseIdCounter = 0;
  cardioIdCounter = 0;
  addExerciseBlock();
  sheetBackdrop.classList.add("open");
});
document.getElementById("closeSheet").addEventListener("click", () => sheetBackdrop.classList.remove("open"));
sheetBackdrop.addEventListener("click", (e) => { if (e.target === sheetBackdrop) sheetBackdrop.classList.remove("open"); });

document.getElementById("addExerciseBtn").addEventListener("click", () => addExerciseBlock());

function addExerciseBlock() {
  const id = "ex" + (exerciseIdCounter++);
  const container = document.getElementById("exerciseContainer");
  const block = document.createElement("div");
  block.className = "exercise-block";
  block.dataset.exId = id;
  block.innerHTML = `
    <div class="ex-head">
      <input type="text" placeholder="Nome esercizio (es. Panca piana)" class="ex-name">
      <button class="icon-btn ex-remove" title="Rimuovi esercizio">✕</button>
    </div>
    <div class="sets-container"></div>
    <button class="link-btn add-set-btn" style="color:var(--gym);">+ Aggiungi serie</button>
  `;
  container.appendChild(block);

  block.querySelector(".ex-remove").addEventListener("click", () => block.remove());
  block.querySelector(".add-set-btn").addEventListener("click", () => addSetRow(block));

  addSetRow(block);
}

function addSetRow(block) {
  const setsContainer = block.querySelector(".sets-container");
  const idx = setsContainer.children.length + 1;
  const row = document.createElement("div");
  row.className = "set-input-row";
  row.innerHTML = `
    <span class="set-num">${idx}</span>
    <input type="number" placeholder="rip." class="set-reps" inputmode="numeric" min="0">
    <input type="number" placeholder="kg" class="set-weight" inputmode="decimal" min="0" step="0.5">
    <button class="set-remove" title="Rimuovi serie">✕</button>
  `;
  setsContainer.appendChild(row);
  row.querySelector(".set-remove").addEventListener("click", () => {
    row.remove();
    renumberSets(setsContainer);
  });
}

function renumberSets(setsContainer) {
  [...setsContainer.children].forEach((row, i) => {
    row.querySelector(".set-num").textContent = i + 1;
  });
}

document.getElementById("addCardioBtn").addEventListener("click", () => addCardioBlock());

function addCardioBlock() {
  const id = "cardio" + (cardioIdCounter++);
  const container = document.getElementById("cardioContainer");
  const block = document.createElement("div");
  block.className = "exercise-block";
  block.dataset.cardioId = id;
  block.innerHTML = `
    <div class="ex-head">
      <input type="text" placeholder="Attività (es. Corsa, Nuoto, Basket, Ciclismo…)" class="cardio-activity">
      <button class="icon-btn cardio-remove" title="Rimuovi cardio">✕</button>
    </div>
    <div class="cardio-grid">
      <div class="field"><label>Distanza km</label><input type="number" class="cardio-distance" inputmode="decimal" min="0" step="0.1" placeholder="se pertinente"></div>
      <div class="field"><label>Durata min</label><input type="number" class="cardio-duration" inputmode="numeric" min="0" step="1"></div>
      <div class="field"><label>Kcal bruciate</label><input type="number" class="cardio-kcal" inputmode="numeric" min="0" step="1"></div>
    </div>
    <div class="cardio-speed" style="font-size:0.8rem; color:var(--text-dim); margin-top:6px;">Velocità media: —</div>
    <button type="button" class="link-btn cardio-estimate-btn" style="color:var(--gym); margin-top:6px;">✨ Stima kcal con AI</button>
    <div class="ai-status cardio-ai-status" style="display:none; margin-top:6px; margin-bottom:0;"><span class="spinner"></span> Stima in corso…</div>
    <div class="error-msg cardio-error" style="display:none; margin-top:6px;"></div>
  `;
  container.appendChild(block);

  block.querySelector(".cardio-remove").addEventListener("click", () => block.remove());

  const activityInput = block.querySelector(".cardio-activity");
  const distanceInput = block.querySelector(".cardio-distance");
  const durationInput = block.querySelector(".cardio-duration");
  const kcalInput = block.querySelector(".cardio-kcal");
  const speedLabel = block.querySelector(".cardio-speed");
  const updateSpeed = () => {
    const distance = Number(distanceInput.value);
    const duration = Number(durationInput.value);
    if (distance > 0 && duration > 0) {
      speedLabel.textContent = `Velocità media: ${(distance / (duration / 60)).toFixed(1)} km/h`;
    } else {
      speedLabel.textContent = "Velocità media: —";
    }
  };
  distanceInput.addEventListener("input", updateSpeed);
  durationInput.addEventListener("input", updateSpeed);

  const estimateBtn = block.querySelector(".cardio-estimate-btn");
  const statusEl = block.querySelector(".cardio-ai-status");
  const errEl = block.querySelector(".cardio-error");
  estimateBtn.addEventListener("click", async () => {
    errEl.style.display = "none";
    const activity = activityInput.value.trim();
    const duration = Number(durationInput.value);
    if (!activity || !duration) {
      errEl.textContent = "Inserisci attività e durata prima di stimare le kcal.";
      errEl.style.display = "block";
      return;
    }
    if (!hasApiKey()) {
      alert("Imposta prima la tua Anthropic API key nelle Impostazioni (dalla Home).");
      return;
    }
    statusEl.style.display = "flex";
    estimateBtn.disabled = true;
    try {
      const distance = Number(distanceInput.value) || undefined;
      const kcal = await estimateKcalForActivity(activity, duration, distance, currentProfile);
      kcalInput.value = Math.round(kcal);
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = "block";
    } finally {
      statusEl.style.display = "none";
      estimateBtn.disabled = false;
    }
  });
}

document.getElementById("saveWorkoutBtn").addEventListener("click", async () => {
  const date = document.getElementById("wDate").value;
  const notes = document.getElementById("wNotes").value.trim();
  const errEl = document.getElementById("wError");
  errEl.style.display = "none";

  if (!date) {
    errEl.textContent = "Seleziona una data.";
    errEl.style.display = "block";
    return;
  }

  const exercises = [];
  document.querySelectorAll("#exerciseContainer .exercise-block").forEach((block) => {
    const name = block.querySelector(".ex-name").value.trim();
    if (!name) return;
    const sets = [];
    block.querySelectorAll(".set-input-row").forEach((row) => {
      const reps = row.querySelector(".set-reps").value;
      const weight = row.querySelector(".set-weight").value;
      if (reps !== "" || weight !== "") {
        sets.push({ reps: Number(reps) || 0, weight: Number(weight) || 0 });
      }
    });
    if (sets.length > 0) exercises.push({ name, sets });
  });

  const cardio = [];
  document.querySelectorAll("#cardioContainer .exercise-block").forEach((block) => {
    const activity = block.querySelector(".cardio-activity").value.trim();
    const distanceKm = Number(block.querySelector(".cardio-distance").value) || 0;
    const durationMin = Number(block.querySelector(".cardio-duration").value) || 0;
    const kcal = Number(block.querySelector(".cardio-kcal").value) || 0;
    if (!activity && !distanceKm && !durationMin && !kcal) return;
    const speedKmh = distanceKm > 0 && durationMin > 0 ? Math.round((distanceKm / (durationMin / 60)) * 10) / 10 : 0;
    cardio.push({ activity: activity || "Cardio", distanceKm, durationMin, speedKmh, kcal });
  });

  if (exercises.length === 0 && cardio.length === 0) {
    errEl.textContent = "Aggiungi almeno un esercizio o una sessione cardio valida.";
    errEl.style.display = "block";
    return;
  }

  const btn = document.getElementById("saveWorkoutBtn");
  btn.disabled = true;
  btn.textContent = "Salvataggio…";

  try {
    await addDoc(collection(db, "users", currentUser.uid, "workouts"), {
      date, exercises, cardio, notes, createdAt: serverTimestamp()
    });
    sheetBackdrop.classList.remove("open");
    showToast("Allenamento salvato");
    loadWorkouts();
  } catch (e) {
    errEl.textContent = "Errore nel salvataggio: " + e.message;
    errEl.style.display = "block";
  } finally {
    btn.disabled = false;
    btn.textContent = "Salva allenamento";
  }
});
</script>
</body>
</html>
